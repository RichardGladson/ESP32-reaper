; DOOMBOX REAPER - PlatformIO configuration
; Target: ESP32-C3 Super Mini
; Framework: Arduino

[env:esp32-c3-super-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP32-C3 specific build flags
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DDOOMBOX_REAPER_VERSION=\"1.0.0\"

lib_deps =
    nrf24/RF24@^1.4.10

; Keep flash size reasonable for Super Mini
board_build.partitions = default.csv
board_build.flash_mode = qio
board_build.f_cpu = 160000000L
